name: Build Windows

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Select game
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          $title = $env:PR_TITLE.ToUpperInvariant()

          if ($title.Contains("[TF2]")) {
            "VPC_GAMES=/tf" >> $env:GITHUB_ENV
            "SOLUTION=tf2.sln" >> $env:GITHUB_ENV
          }
          elseif ($title.Contains("[HL2MP]")) {
            "VPC_GAMES=/hl2mp" >> $env:GITHUB_ENV
            "SOLUTION=hl2mp.sln" >> $env:GITHUB_ENV
          }
          else {
            "VPC_GAMES=/tf /hl2mp" >> $env:GITHUB_ENV
            "SOLUTION=all.sln" >> $env:GITHUB_ENV
          }

      - name: Generate solution
        working-directory: src
        shell: pwsh
        run: |
          $games = $env:VPC_GAMES -split " "
          & .\devtools\bin\vpc.exe @games /define:SOURCESDK +game /mksln $env:SOLUTION

      - name: Build
        working-directory: src
        run: msbuild $env:SOLUTION /m /p:Configuration=Release /p:Platform=win64
