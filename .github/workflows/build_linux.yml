name: Build - Linux

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y podman ccache

      - name: Create ccache directory
        run: mkdir -p ~/.ccache

      - name: Build all projects
        working-directory: src
        run: ./buildallprojects

      - name: Collect artifact
        run: |
          mkdir -p artifact/game
          cp -r game/. artifact/game/
          rm -f artifact/game/fortress_sandbox_linux64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsb-linux
          path: artifact/
