name: Build - Linux

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y podman ccache

      - name: Create ccache directory
        run: mkdir -p ~/.ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build
        working-directory: src
        run: ./buildallprojects

      - name: Collect artifact
        run: |
          mkdir -p artifact/game
          cp -r game/. artifact/game/

      - name: Zip artifact
        run: |
          cd artifact
          zip -r ../fsb-linux.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsb-linux
          path: fsb-linux.zip
