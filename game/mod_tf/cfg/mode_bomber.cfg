// Frog Bomber — flat itemtest + sky play layer (no terrain)

echo "Frog Fortress: Bomberman — ff_play uses itemtest + sky arena"

tf_ff_game_mode 3



tf_bot_quota 0

mp_autoteambalance 0



tf_bm_cell_size 64

tf_bm_move_speed 400

tf_bm_bomb_fuse 2.5

tf_bm_bomb_range 2

tf_bm_max_bombs 1

tf_bm_respawn_time 2

tf_bm_build_id phase6-sky-body



tf_bm_sky_arena 1

tf_bm_sky_height 3072



tf_bm_arena_width 15

tf_bm_arena_height 13

tf_bm_arena_soft_fill 0.45

tf_bm_render_props 1



tf_bm_cam_height 900

tf_bm_cam_pitch 89

tf_bm_clip_world 0

tf_bm_show_grid 1



bind MOUSE1 "+attack"

bind e "+use"

