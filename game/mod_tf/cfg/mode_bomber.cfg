// Frog Bomber — use ff_play bomber (not exec alone on stock OW maps).

echo "=== Frog Bomber phase28-hud-floor ==="

tf_ff_game_mode 3
tf_ow_mode 0
tf_rim_mode 0

tf_bot_quota 0
mp_autoteambalance 0
mp_waitingforplayers_cancel 1

tf_bm_build_id phase28-hud-floor

tf_bm_cell_size 64
tf_bm_arena_width 15
tf_bm_arena_height 13
tf_bm_arena_soft_fill 0.35

tf_bm_void_arena 0
tf_bm_arena_offset 0 0
tf_bm_platform_height 512
tf_bm_platform_z 0
tf_bm_arena_lift 0
tf_bm_sky_arena 0

tf_bm_move_speed 400
tf_bm_bomb_fuse 2.5
tf_bm_bomb_range 3
tf_bm_max_bombs 2
tf_bm_respawn_time 2

tf_bm_render_props 0
tf_bm_deck_visible 1
tf_bm_camera_mode 1
tf_bm_deck_props 0

tf_bm_cam_height 480
tf_bm_cam_pitch -89
tf_bm_cam_back 0
tf_bm_clip_world 0
tf_bm_clip_height 256
tf_bm_show_grid 0
tf_bm_draw_floor 0
tf_bm_client_snap 0

// itemtest fallback is dark without a compiled map — listen dev only until bm_arena.bsp exists
sv_cheats 1
mat_fullbright 1

bind MOUSE1 "+attack"
bind e "+use"
