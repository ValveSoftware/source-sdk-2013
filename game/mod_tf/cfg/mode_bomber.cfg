// Frog Bomber — minimal playable (itemtest / bm_arena). Use ff_play bomber from OW maps, not exec alone.

echo "=== Frog Bomber phase24-visible — visible deck + camera depth fix ==="

tf_ff_game_mode 3
tf_ow_mode 0
tf_rim_mode 0

tf_bot_quota 0
mp_autoteambalance 0
mp_waitingforplayers_cancel 1

tf_bm_build_id phase24-visible

tf_bm_cell_size 64
tf_bm_arena_width 15
tf_bm_arena_height 13
tf_bm_arena_soft_fill 0.35

// bm_arena uses 0 0 in code. itemtest fallback auto-offsets to 8192 8192 (isolated void platform).
tf_bm_arena_offset 0 0
tf_bm_platform_height 512
tf_bm_platform_z 0
tf_bm_arena_lift 0
tf_bm_sky_arena 0

tf_bm_move_speed 400
tf_bm_bomb_fuse 2.5
tf_bm_bomb_range 3
tf_bm_max_bombs 2
tf_bm_respawn_time 2

// 1 = draw wall/crate models; deck tiles always spawn when tf_bm_deck_visible 1
tf_bm_render_props 1
tf_bm_deck_visible 1
tf_bm_deck_props 0

tf_bm_cam_height 480
tf_bm_cam_pitch 89
tf_bm_cam_back 0
tf_bm_clip_world 0
tf_bm_clip_height 256
tf_bm_show_grid 0
tf_bm_draw_floor 1
tf_bm_client_snap 0

mat_disable_fog 1
r_drawviewmodel 0

bind MOUSE1 "+attack"
bind e "+use"
