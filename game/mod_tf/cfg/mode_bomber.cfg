// Frog Bomber — itemtest play room + code grid (auto-sized to room).

echo "=== Frog Bomber reset-v21-free-roam ==="

tf_ff_game_mode 3
tf_ow_mode 0
tf_rim_mode 0

tf_bot_quota 0
mp_autoteambalance 0
mp_friendlyfire 1
tf_bm_ffa 1
mp_waitingforplayers_cancel 1

tf_bm_build_id reset-v21-free-roam

// Hammer room AABB (getpos corners) — used to auto-fit grid; play bounds follow the built grid.
tf_bm_room_min_x 1304.03125
tf_bm_room_min_y -2535.97412
tf_bm_room_max_x 2023.96875
tf_bm_room_max_y -280.03979

tf_bm_camera_mode 0
tf_bm_floor_z_override -135
tf_bm_floor_deck 1
tf_bm_floor_drop 288

tf_bm_cell_size 64
tf_bm_arena_width 0
tf_bm_arena_height 0
tf_bm_arena_soft_fill 0.35

tf_bm_void_arena 0
tf_bm_arena_offset 0 0
tf_bm_platform_height 512
tf_bm_platform_z 0
tf_bm_arena_lift 0
tf_bm_sky_arena 0

// Free walk in the room (no grid steps, no spawn warp on walls).
tf_bm_grid_move 0
tf_bm_arena_lock 0

tf_bm_move_speed 400
tf_bm_bomb_fuse 2.5
tf_bm_bomb_range 3
tf_bm_max_bombs 2
tf_bm_respawn_time 2

tf_bm_render_props 0
tf_bm_deck_visible 0
tf_bm_deck_props 0

tf_bm_cam_height 480
tf_bm_cam_pitch -89
tf_bm_cam_back 0
tf_bm_clip_world 0
tf_bm_clip_height 256
tf_bm_show_grid 0
tf_bm_draw_floor 0
tf_bm_bomb_visible 1
tf_bm_bomb_scale 0.18
tf_bm_client_snap 0

sv_cheats 1
mat_fullbright 1

bind MOUSE1 "+attack"
bind e "+use"

echo "Walk freely in the room. Classic grid steps: tf_bm_grid_move 1"
echo "Stuck/fell: bm_fix then kill. Explore: bm_letgo + noclip"
