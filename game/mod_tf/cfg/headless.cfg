// Headless NextBot test configuration
// - Overrides autoexec logging to write into nbheadlessdebuglogs
// - Provides headless-specific aliases to select nb_debug modes

sv_cheats 1
developer 1
con_timestamp 1

// Default: route general logs here until a specific mode is applied
con_logfile "nbheadlessdebuglogs/nextbot.debug.txt"
alias hd_log_apply "con_logfile nbheadlessdebuglogs/nextbot.debug.txt"
alias hd_log_tag "echo [HD] nbheadlessdebuglogs/nextbot.debug.txt is now being logged"
echo "[HD] Logging to nbheadlessdebuglogs/nextbot.debug.txt"

// Ensure directory-specific debug aliases that mirror autoexec but for headless logs
alias hd_apply_nb_off      "alias hd_log_apply con_logfile nbheadlessdebuglogs/nextbot.debug.txt; alias hd_log_tag echo [HD] nbheadlessdebuglogs/nextbot.debug.txt is now being logged; con_logfile nbheadlessdebuglogs/nextbot.debug.txt; echo [HD] ===== LOG START =====; hd_log_tag; status; sv_cheats 1; nb_debug; echo [HD] NB debug OFF"
alias hd_apply_nb_behavior "alias hd_log_apply con_logfile nbheadlessdebuglogs/nb.behavior.debug.txt; alias hd_log_tag echo [HD] nbheadlessdebuglogs/nb.behavior.debug.txt is now being logged; con_logfile nbheadlessdebuglogs/nb.behavior.debug.txt; echo [HD] ===== LOG START =====; hd_log_tag; status; sv_cheats 1; nb_debug behavior; echo [HD] NB debug=behavior -> nbheadlessdebuglogs/nb.behavior.debug.txt"
alias hd_apply_nb_lookat   "alias hd_log_apply con_logfile nbheadlessdebuglogs/bot-visuals-debug/nb.lookat.debug.txt; alias hd_log_tag echo [HD] nbheadlessdebuglogs/bot-visuals-debug/nb.lookat.debug.txt is now being logged; con_logfile nbheadlessdebuglogs/bot-visuals-debug/nb.lookat.debug.txt; echo [HD] ===== LOG START =====; hd_log_tag; status; sv_cheats 1; nb_debug look_at; echo [HD] NB debug=look_at -> nbheadlessdebuglogs/bot-visuals-debug/nb.lookat.debug.txt"
alias hd_apply_nb_vision   "alias hd_log_apply con_logfile nbheadlessdebuglogs/bot-visuals-debug/nb.vision.debug.txt; alias hd_log_tag echo [HD] nbheadlessdebuglogs/bot-visuals-debug/nb.vision.debug.txt is now being logged; con_logfile nbheadlessdebuglogs/bot-visuals-debug/nb.vision.debug.txt; echo [HD] ===== LOG START =====; hd_log_tag; status; sv_cheats 1; nb_debug vision; echo [HD] NB debug=vision -> nbheadlessdebuglogs/bot-visuals-debug/nb.vision.debug.txt"
alias hd_apply_nb_path     "alias hd_log_apply con_logfile nbheadlessdebuglogs/nb.path.debug.txt; alias hd_log_tag echo [HD] nbheadlessdebuglogs/nb.path.debug.txt is now being logged; con_logfile nbheadlessdebuglogs/nb.path.debug.txt; echo [HD] ===== LOG START =====; hd_log_tag; status; sv_cheats 1; nb_debug path; echo [HD] NB debug=path -> nbheadlessdebuglogs/nb.path.debug.txt"
alias hd_apply_nb_loco     "alias hd_log_apply con_logfile nbheadlessdebuglogs/nb.locomotion.debug.txt; alias hd_log_tag echo [HD] nbheadlessdebuglogs/nb.locomotion.debug.txt is now being logged; con_logfile nbheadlessdebuglogs/nb.locomotion.debug.txt; echo [HD] ===== LOG START =====; hd_log_tag; status; sv_cheats 1; nb_debug locomotion; echo [HD] NB debug=locomotion -> nbheadlessdebuglogs/nb.locomotion.debug.txt"

// Engineer seams debug default (can be overridden by command line)
tf_bot_engineer_seams_debug 1
// Optional: uncomment to set a default repair priority threshold
// tf_bot_engineer_seams_repair_health_frac 0.6

// Deferred application at map load: store a pending apply alias that is executed by listenserver.cfg
alias hd_nbdbg_pending ""
alias hd_apply_nbdbg "hd_nbdbg_pending; alias hd_nbdbg_pending \"\""

// Helpers to set the pending alias (call before +map)
alias hd_set_pending_off "alias hd_nbdbg_pending hd_apply_nb_off"
alias hd_set_pending_behavior "alias hd_nbdbg_pending hd_apply_nb_behavior"
alias hd_set_pending_lookat "alias hd_nbdbg_pending hd_apply_nb_lookat"
alias hd_set_pending_vision "alias hd_nbdbg_pending hd_apply_nb_vision"
alias hd_set_pending_path "alias hd_nbdbg_pending hd_apply_nb_path"
alias hd_set_pending_loco "alias hd_nbdbg_pending hd_apply_nb_loco"

echo "[HD] Headless cfg applied. Use hd_set_pending_* before +map, or hd_apply_nb_* live."
