// Quick Frog Fortress mode launchers (host / listen server).
// Usage: exec ff_aliases.cfg  then  ff_ow / ff_rim / ff_bomber / ff_stock

alias ff_ow "ff_play ow"
alias ff_rim "ff_play rim"
alias ff_bomber "ff_play bomber"
alias ff_stock "ff_play stock"

echo "Frog Fortress aliases: ff_ow ff_rim ff_bomber ff_stock (or ff_play <mode> [map])"
