// Visual debugging convenience config (look_at/vision)
// Usage: exec nb_visual_debug.cfg

sv_cheats 1
developer 1
con_timestamp 1

// Bring in all NB helper aliases
exec nbdebug.cfg

// Use a clean background map for minimal noise
apm_load_bg

// Keep bot count low for visual spam modes
tf_bot_force_class engineer
tf_bot_quota_mode fill
tf_bot_quota 2
mp_waitingforplayers_cancel 1

// Default to look_at; switch to vision by running: nb_dbg_vision_live
apm_apply_nb_lookat

echo "[APM] Visual debug configured (2 bots, look_at). For vision: nb_dbg_vision_live"

