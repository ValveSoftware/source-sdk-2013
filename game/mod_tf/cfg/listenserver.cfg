// Runs when you host a listen server.
sv_lan 1
mod_skip_webapi_inventory 1

// Canonical Frog Fortress mode + OW defaults (see MODE_SWITCH.md).
exec mode_ow.cfg

tf_bot_spawn_use_preset_roster 0
mp_autoteambalance 0
tf_bot_auto_vacate 0

// OW bots are queued when the round starts, not here.
exec ow_quickstart
