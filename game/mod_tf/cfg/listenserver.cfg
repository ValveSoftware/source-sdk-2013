// Executed on map load for listen servers
// Apply any deferred NB debug aliases set earlier, then clear them.

sv_cheats 1

// Ensure pending aliases exist to avoid unknown-command noise
alias apm_nbdbg_pending ""
alias hd_nbdbg_pending ""

// Apply and clear any deferred NB debug choices set pre-map
apm_nbdbg_pending
alias apm_nbdbg_pending ""

hd_nbdbg_pending
alias hd_nbdbg_pending ""

echo "[APM] listenserver.cfg: applied any pending NB debug aliases (interactive/headless)"
