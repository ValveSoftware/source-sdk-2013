// Overwatch-style hero shooter (default plan)
echo "Frog Fortress: OW hero mode"
tf_ff_game_mode 1

tf_ow_hero_lock 1
tf_ow_respawn_time 6
tf_ow_bots_per_team 5
tf_ow_enemy_bonus_on_join 1
tf_bot_quota 0
tf_bot_join_after_player 0

tf_rim_pistol_only 0
tf_rim_use_payload 0

bind q "+ow_ability3"
bind e "+ow_ability2"
bind shift "+ow_ability1"
bind r "+ow_ultimate"

bind f2 "ow_hero skirmisher"
bind f3 "ow_hero tank"
bind f4 "ow_hero bruiser"
bind f5 "ow_hero sniper"
bind f6 "ow_hero healer"
bind f7 "ow_hero builder"
