// T5.4 weapon prioritization with tuned ranges + T5.3 pause+tuned
sv_cheats 1
developer 1

// Base: ensure building is enabled
tf_bot_engineer_ignore_building 0

// Enable T5.3 pause+tuned
exec apm/apm_t5_3_enable.cfg
exec apm/apm_t5_3_pause.cfg
exec apm/apm_t5_3_tuned.cfg

// Enable T5.4 with tuned ranges
tf_bot_engineer_seams_debug 1
tf_bot_engineer_seams_weapon_prioritize 1
tf_bot_engineer_seams_weapon_shotgun_range 700
tf_bot_engineer_seams_weapon_pistol_range 1000

echo "[APM] t54+t53 pause(tuned), ranges: shotgun=700, pistol=1000"
