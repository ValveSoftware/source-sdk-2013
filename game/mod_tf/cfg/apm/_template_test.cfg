// APM Test Config Template
// ------------------------
// Copy this file to apm_<task>_<slug>.cfg and adjust settings below.
// Example: apm_t5_5_new_behavior.cfg
//
// Usage:
//  - Interactive:  exec apm/apm_tX_Y_your_test.cfg
//  - Headless:     HEADLESS_EXTRA_ARGS='+exec apm/apm_tX_Y_your_test.cfg' scripts/headless_test.sh <map> <bots> <mode> <sec>

sv_cheats 1
developer 1
con_timestamp 1

// Engineer build behavior (0=build normally, 1=ignore building behaviors)
tf_bot_engineer_ignore_building 0

// Seam debug toggle (recommended ON during testing)
tf_bot_engineer_seams_debug 1

// Task-specific seam knobs (uncomment & set as needed)

// T5.1 – Repair-first threshold
// tf_bot_engineer_seams_repair_health_frac 0

// T5.2 – Metal reserve and upgrade cap
// tf_bot_engineer_seams_metal_reserve 0
// tf_bot_engineer_seams_upgrade_cap 0

// T5.3 – Threat-aware repair interrupt
// tf_bot_engineer_seams_repair_interrupt 0
// tf_bot_engineer_seams_repair_interrupt_window 1.5
// tf_bot_engineer_seams_repair_interrupt_cooldown 2.0
// tf_bot_engineer_seams_repair_interrupt_attack 0

// T5.4 – Combat weapon prioritization while maintaining
// tf_bot_engineer_seams_weapon_prioritize 0
// tf_bot_engineer_seams_weapon_shotgun_range 450
// tf_bot_engineer_seams_weapon_pistol_range 900

echo "[APM] Loaded _template_test.cfg — copy & customize for your task"
