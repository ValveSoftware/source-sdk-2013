// APM T5.4 test config — weapon prioritization while maintaining nest
// Keeps buildings enabled and raises ranges to force prioritization

sv_cheats 1
developer 1

// Ensure engineers build/maintain nests
tf_bot_engineer_ignore_building 0

// Seam debug and controls
tf_bot_engineer_seams_debug 1
tf_bot_engineer_seams_weapon_prioritize 1
tf_bot_engineer_seams_weapon_shotgun_range 800
tf_bot_engineer_seams_weapon_pistol_range 1200

// Keep T5.3 interrupt disabled to observe weapon selection without suspending
tf_bot_engineer_seams_repair_interrupt 0

echo "[APM] Loaded apm_t5_4_test.cfg (weapon prioritization)"
