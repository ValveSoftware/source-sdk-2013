// Auto-applied when loading the background map via: map_background itemtest
echo "[APM] itemtest background map loaded — enabling cheats and applying pending NB debug"
sv_cheats 1
// Apply any pending NB debug mode set by autoexec aliases, then clear the pending alias
apm_nbdbg_pending
alias apm_nbdbg_pending ""

// Ensure we have a small engineer bot cohort for testing
echo "[APM] Forcing Engineer bots and setting quota to 4 (fill)"
tf_bot_force_class engineer
tf_bot_quota_mode fill
tf_bot_quota 4
// Avoid waiting-for-players countdown in background map
mp_waitingforplayers_cancel 1
