// APM autoexec — NextBot + Engineer seams debugging setup

// Cheats required for FCVAR_CHEAT cvars
sv_cheats 1

// Developer console logging
developer 1
con_timestamp 1

// Default log file for general NextBot + seams traces (inside nbdebuglogs)
con_logfile "nbdebuglogs/nextbot.debug.txt"
// Track current log target for tagging
alias apm_log_apply "con_logfile nbdebuglogs/nextbot.debug.txt"
alias apm_log_tag "echo [APM] nbdebuglogs/nextbot.debug.txt is now being logged"
echo "[APM] Logging to nbdebuglogs/nextbot.debug.txt"
// Discard logging by writing to a throwaway file inside nbdebuglogs (cross-platform safe)
alias apm_log_discard "con_logfile nbdebuglogs/.null.nbdebug.txt"

// Engineer seams debug (guarded code must be compiled in)
tf_bot_engineer_seams_debug 1
tf_bot_engineer_seams_min_teleport_travel 3000

// Baseline teleporter threshold (vanilla guard)
tf_bot_min_teleport_travel 3000

// Deferred NB debug application across map load
alias apm_nbdbg_pending ""
alias apm_apply_nbdbg "apm_nbdbg_pending; alias apm_nbdbg_pending \"\""

// Helper to load a clean background map before enabling verbose NB debugging
alias apm_load_bg "map_background itemtest"

// Helper apply aliases to avoid nested quoting
alias apm_apply_nb_off "alias apm_log_apply con_logfile nbdebuglogs/nextbot.debug.txt; alias apm_log_tag echo [APM] nbdebuglogs/nextbot.debug.txt is now being logged; con_logfile nbdebuglogs/nextbot.debug.txt; echo [APM] ===== LOG START =====; apm_log_tag; status; sv_cheats 1; nb_debug; echo [APM] NB debug OFF"
alias apm_apply_nb_behavior "alias apm_log_apply con_logfile nbdebuglogs/nb.behavior.debug.txt; alias apm_log_tag echo [APM] nbdebuglogs/nb.behavior.debug.txt is now being logged; con_logfile nbdebuglogs/nb.behavior.debug.txt; echo [APM] ===== LOG START =====; apm_log_tag; status; sv_cheats 1; nb_debug behavior; echo [APM] NB debug=behavior -> nbdebuglogs/nb.behavior.debug.txt"
alias apm_apply_nb_lookat "alias apm_log_apply con_logfile nbdebuglogs/bot-visuals-debug/nb.lookat.debug.txt; alias apm_log_tag echo [APM] nbdebuglogs/bot-visuals-debug/nb.lookat.debug.txt is now being logged; con_logfile nbdebuglogs/bot-visuals-debug/nb.lookat.debug.txt; echo [APM] ===== LOG START =====; apm_log_tag; status; sv_cheats 1; nb_debug look_at; echo [APM] NB debug=look_at -> nbdebuglogs/bot-visuals-debug/nb.lookat.debug.txt"
alias apm_apply_nb_vision "alias apm_log_apply con_logfile nbdebuglogs/bot-visuals-debug/nb.vision.debug.txt; alias apm_log_tag echo [APM] nbdebuglogs/bot-visuals-debug/nb.vision.debug.txt is now being logged; con_logfile nbdebuglogs/bot-visuals-debug/nb.vision.debug.txt; echo [APM] ===== LOG START =====; apm_log_tag; status; sv_cheats 1; nb_debug vision; echo [APM] NB debug=vision -> nbdebuglogs/bot-visuals-debug/nb.vision.debug.txt"
alias apm_apply_nb_path "alias apm_log_apply con_logfile nbdebuglogs/nb.path.debug.txt; alias apm_log_tag echo [APM] nbdebuglogs/nb.path.debug.txt is now being logged; con_logfile nbdebuglogs/nb.path.debug.txt; echo [APM] ===== LOG START =====; apm_log_tag; status; sv_cheats 1; nb_debug path; echo [APM] NB debug=path -> nbdebuglogs/nb.path.debug.txt"
alias apm_apply_nb_loco "alias apm_log_apply con_logfile nbdebuglogs/nb.locomotion.debug.txt; alias apm_log_tag echo [APM] nbdebuglogs/nb.locomotion.debug.txt is now being logged; con_logfile nbdebuglogs/nb.locomotion.debug.txt; echo [APM] ===== LOG START =====; apm_log_tag; status; sv_cheats 1; nb_debug locomotion; echo [APM] NB debug=locomotion -> nbdebuglogs/nb.locomotion.debug.txt"
alias apm_apply_nb_nextbot "alias apm_log_apply con_logfile nbdebuglogs/nextbot.debug.txt; alias apm_log_tag echo [APM] nbdebuglogs/nextbot.debug.txt is now being logged; con_logfile nbdebuglogs/nextbot.debug.txt; echo [APM] ===== LOG START =====; apm_log_tag; status; echo [APM] Logging -> nbdebuglogs/nextbot.debug.txt"
alias apm_apply_nb_default "alias apm_log_apply con_logfile nbdebuglogs/nextbot.debug.txt; alias apm_log_tag echo [APM] nbdebuglogs/nextbot.debug.txt is now being logged; con_logfile nbdebuglogs/nextbot.debug.txt; echo [APM] ===== LOG START =====; apm_log_tag; status; echo [APM] Logging -> nbdebuglogs/nextbot.debug.txt"

// NB debug mode aliases: set pending apply alias and load background map
alias nb_dbg_off "alias apm_nbdbg_pending apm_apply_nb_off; apm_load_bg"
alias nb_dbg_behavior "alias apm_nbdbg_pending apm_apply_nb_behavior; apm_load_bg"
alias nb_dbg_lookat "alias apm_nbdbg_pending apm_apply_nb_lookat; apm_load_bg"
alias nb_dbg_vision "alias apm_nbdbg_pending apm_apply_nb_vision; apm_load_bg"
alias nb_dbg_path "alias apm_nbdbg_pending apm_apply_nb_path; apm_load_bg"
alias nb_dbg_loco "alias apm_nbdbg_pending apm_apply_nb_loco; apm_load_bg"
alias nb_dbg_nextbot "alias apm_nbdbg_pending apm_apply_nb_nextbot; apm_load_bg"
alias apm_log_default "alias apm_nbdbg_pending apm_apply_nb_default; apm_load_bg"

// Start with NB console debug off to avoid spam; seams debug still logs
nb_dbg_off

echo "[APM] Autoexec loaded. Try: nb_dbg_behavior | nb_dbg_path | nb_dbg_lookat | nb_dbg_vision | nb_dbg_loco | nb_dbg_off"

// --- Live (in-map) NB debug toggles: no map change ---
alias nb_dbg_off_live "apm_apply_nb_off"
alias nb_dbg_behavior_live "apm_apply_nb_behavior"
alias nb_dbg_lookat_live "apm_apply_nb_lookat"
alias nb_dbg_vision_live "apm_apply_nb_vision"
alias nb_dbg_path_live "apm_apply_nb_path"
alias nb_dbg_loco_live "apm_apply_nb_loco"

// Quick binds for live toggles — keypad only
bind KP_LEFTARROW "nb_dbg_behavior_live"  // NumPad 4
bind KP_5 "nb_dbg_path_live"              // NumPad 5
bind KP_RIGHTARROW "nb_dbg_off_live"      // NumPad 6
bind KP_END "nb_dbg_lookat_live"          // NumPad 1
bind KP_DOWNARROW "nb_dbg_vision_live"    // NumPad 2
bind KP_PGDN "nb_dbg_loco_live"           // NumPad 3

// Quick spawn of 4 Engineer bots (live)
alias apm_bots_engi4_live "sv_cheats 1; tf_bot_force_class engineer; tf_bot_quota_mode fill; tf_bot_quota 4; mp_waitingforplayers_cancel 1; echo [APM] Engineer bots quota set to 4 (fill) and waiting-for-players canceled"
bind KP_HOME "apm_bots_engi4_live"        // NumPad 7

// Fresh-start utility: kick all bots, re-apply current log target, tag start
alias apm_fresh_start "sv_cheats 1; apm_log_discard; tf_bot_kick all; clear; apm_log_apply; echo [APM] ===== NEW LOG START =====; apm_log_tag; status"
bind KP_INS "apm_fresh_start"              // NumPad 0
