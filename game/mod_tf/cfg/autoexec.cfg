// Frog Fortress — Frog Bomber is the default mode (see MODE_SWITCH.md).
// Switch anytime: ff_ow  ff_rim  ff_stock  (after exec ff_aliases.cfg)

con_enable 1
sv_lan 1
mod_skip_webapi_inventory 1

exec mode_bomber.cfg
exec ff_aliases.cfg

tf_bot_spawn_use_preset_roster 0
tf_bot_quota 0
tf_bot_join_after_player 0
mp_autoteambalance 0
tf_bot_auto_vacate 0

bind ` toggleconsole
bind F1 toggleconsole

echo "Default mode: Frog Bomber. Other modes: ff_ow ff_rim ff_stock"
echo "Quick arena: ff_bomber  (itemtest + bomber cfg)"
